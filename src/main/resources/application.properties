spring.application.name=practicas-ubb
server.address=127.0.0.1
server.port=${APP_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/practicas_ubb?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false

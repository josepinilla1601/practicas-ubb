spring.application.name=practicas-ubb
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=dev
server.port=${APP_PORT:8080}
# Ruta base cuando el sitio se publica bajo un subdirectorio (vacía en local).
server.servlet.context-path=${APP_CONTEXT_PATH:}
# Respeta los encabezados del proxy HTTPS del servidor (Pacheco).
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# En un dominio compartido (Pacheco) la cookie lleva nombre y ruta propios para no chocar con otras apps.
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:JSESSIONID}
server.servlet.session.cookie.path=${SESSION_COOKIE_PATH:}
server.servlet.session.cookie.same-site=lax
